/* ─── THUMBNAIL ──────────────────────────────────────────── */
function Thumb({exId,size=88}){
  const storageKey=`thumb_${exId}`;
  // initialise from localStorage — survives restarts; only overwritten on explicit upload
  const [src,setSrc]=useState(()=>LS.str(storageKey,""));
  const ref=useRef();
  const pick=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      // persist indefinitely — only this explicit upload overwrites the stored image
      LS.sset(storageKey,ev.target.result);
      setSrc(ev.target.result);
    };
    r.readAsDataURL(f);
  };
  return(
    <div className="thumb-sq" style={{width:size,height:size,minWidth:size}} onClick={()=>ref.current.click()}>
      {src
        ?<img src={src} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
        :<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",gap:5}}>
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
            <rect x="2" y="6" width="28" height="20" rx="3" stroke="rgba(255,255,255,.2)" strokeWidth="1.5" fill="none"/>
            <circle cx="11" cy="13" r="3" stroke="rgba(255,255,255,.15)" strokeWidth="1.5" fill="none"/>
            <path d="M2 22l7-7 5 5 5-5 8 8" stroke="rgba(255,255,255,.15)" strokeWidth="1.5" strokeLinejoin="round" fill="none"/>
          </svg>
          <span style={{fontSize:8,color:"rgba(255,255,255,.28)",fontFamily:"'DM Mono',monospace",letterSpacing:.8,textAlign:"center",lineHeight:1.4}}>TAP TO<br/>ADD PHOTO</span>
        </div>
      }
      <div className="thumb-ov"><span style={{fontSize:22,filter:"drop-shadow(0 0 8px rgba(200,255,0,.9))"}}>📷</span></div>
      <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={pick}/>
    </div>
  );
}

/* ─── PROGRESS CHART (Bar — save-gated) ─────────────────────── */
function Chart({exName,color}){
  const [range,setRange]=useState("30D");
  // reads only from the save-committed history, never from live mid-session data
  const data=useMemo(()=>{
    const days=range==="7D"?7:range==="30D"?30:3650;
    const cut=Date.now()-days*86400000;
    const map={};
    (LS.get("il_slog_saved",[])||[])
      .filter(l=>l.exName===exName&&new Date(l.date).getTime()>=cut)
      .forEach(l=>{
        if(!map[l.date]||l.maxW>map[l.date].w)
          map[l.date]={w:l.maxW,d:l.date.slice(5)};
      });
    return Object.values(map).sort((a,b)=>a.d.localeCompare(b.d));
  },[exName,range]);

  const Tip=({active,payload,label})=>{
    if(!active||!payload?.length)return null;
    return<div style={{background:"rgba(5,2,15,.95)",border:`1px solid ${color}55`,borderRadius:10,padding:"8px 12px",fontFamily:"'DM Mono',monospace",fontSize:11}}>
      <div style={{color:"rgba(255,255,255,.45)",marginBottom:3}}>{label}</div>
      {payload.map((p,i)=><div key={i} style={{color:p.color}}>{p.name}: <span style={{color:"#fff"}}>{p.value}</span></div>)}
    </div>;
  };

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontWeight:800,fontSize:12,color:"#fff",letterSpacing:1}}>PROGRESS <span style={{color:color}}>CHART</span></div>
        <div style={{display:"flex",gap:4}}>
          {["7D","30D","ALL"].map(r=><button key={r} className={`chip ${range===r?"chip-on":""}`} style={{fontSize:9,padding:"3px 10px"}} onClick={()=>setRange(r)}>{r}</button>)}
        </div>
      </div>
      {data.length===0
        ?<div style={{height:90,display:"flex",alignItems:"center",justifyContent:"center",color:"rgba(255,255,255,.18)",fontFamily:"'DM Mono',monospace",fontSize:10,letterSpacing:1}}>SAVE A SESSION TO SEE PROGRESS</div>
        :<ResponsiveContainer width="100%" height={110}>
          <BarChart data={data} margin={{top:4,right:4,bottom:0,left:-22}}>
            <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,.04)" vertical={false}/>
            <XAxis dataKey="d" tick={{fill:"rgba(255,255,255,.32)",fontSize:9,fontFamily:"'DM Mono',monospace"}} axisLine={false} tickLine={false}/>
            <YAxis tick={{fill:"rgba(255,255,255,.32)",fontSize:9,fontFamily:"'DM Mono',monospace"}} axisLine={false} tickLine={false}/>
            <Tooltip content={<Tip/>}/>
            <Bar dataKey="w" name="Max Wt" fill={color} radius={[4,4,0,0]}/>
          </BarChart>
        </ResponsiveContainer>
      }
    </div>
  );
}

/* ─── EXERCISE CARD ──────────────────────────────────────── */
function ExCard({ex,idx,color,savedSets,onSets,onEx,onDelete,prev}){
  const [open,setOpen]=useState(false);
  const [showChart,setShowChart]=useState(false);

  // always start with 3 sets minimum; preserve saved data
  const sets=savedSets&&savedSets.length>0?savedSets:Array.from({length:3},()=>({weight:"",reps:""}));
  const logged=sets.filter(s=>s.weight||s.reps).length;
  const pct=sets.length>0?Math.round(logged/sets.length*100):0;
  const done=logged===sets.length&&sets.length>0;

  const upd=(i,field,val)=>{const ns=[...sets];ns[i]={...ns[i],[field]:val};onSets(ns)};

  // target line: use prev record if available, otherwise fall back to ex defaults (no random numbers)
  const targetLine=prev
    ?`${sets.length} SETS · TARGET: ${prev.weight}${ex.unit} × ${prev.reps}`
    :`${sets.length} SETS · ${ex.reps} REPS · ${ex.unit}`;

  return(
    <div className="glass" style={{marginBottom:12,borderColor:done?`${color}55`:"rgba(255,255,255,.08)",background:done?`${color}09`:undefined}}>
      {/* TOP: photo left | info right */}
      <div style={{display:"flex",gap:12,padding:"12px 12px 0"}}>
        <Thumb exId={ex.id} size={90}/>
        <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:5}}>
          {/* Editable name — wraps to 2-3 lines on mobile */}
          <input value={ex.name} onChange={e=>onEx({...ex,name:e.target.value.toUpperCase()})}
            style={{
              background:"rgba(0,0,0,.5)",border:"none",
              borderBottom:`1.5px solid ${color}44`,color:"#fff",
              fontSize:13,fontFamily:"'Syne',sans-serif",fontWeight:800,letterSpacing:1.5,
              outline:"none",width:"100%",paddingBottom:3,
              transition:"border-color .2s",borderRadius:0,
              /* allow text to wrap — no truncation on narrow viewports */
              whiteSpace:"normal",wordBreak:"break-word",lineHeight:1.35,
            }}
            onFocus={e=>e.target.style.borderBottomColor=color}
            onBlur={e=>e.target.style.borderBottomColor=`${color}44`}/>

          {/* LAST TIME badge */}
          {prev
            ?<div style={{display:"inline-flex",alignItems:"center",gap:5,background:"rgba(0,0,0,.55)",border:`1px solid ${color}30`,borderRadius:6,padding:"3px 8px",width:"fit-content"}}>
              <span style={{fontSize:8,color:"rgba(255,255,255,.4)",fontFamily:"'DM Mono',monospace",letterSpacing:1}}>LAST TIME</span>
              <span style={{fontSize:11,color,fontFamily:"'DM Mono',monospace",fontWeight:500}}>{prev.weight}{ex.unit} · {prev.reps}×{prev.sets}</span>
              <span style={{fontSize:8,color:"rgba(255,255,255,.22)",fontFamily:"'DM Mono',monospace"}}>{prev.date}</span>
            </div>
            :<div style={{fontSize:9,color:"rgba(255,255,255,.22)",fontFamily:"'DM Mono',monospace",letterSpacing:.8}}>NO PREVIOUS RECORD</div>
          }

          {/* Target (from prev record) + progress + action buttons */}
          <div style={{display:"flex",alignItems:"center",gap:6,marginTop:1}}>
            {/* target line — dynamically pulled from prev, no random numbers */}
            <div style={{fontSize:9,color:"rgba(255,255,255,.38)",fontFamily:"'DM Mono',monospace",letterSpacing:.5,flex:1,minWidth:0,wordBreak:"break-word"}}>
              {targetLine}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:500,color:done?color:"rgba(255,255,255,.38)"}}>{pct}%</span>
              <button className="btn-ghost" style={{padding:"4px 8px",fontSize:11,lineHeight:1,transform:open?"rotate(180deg)":"none",transition:"transform .2s"}} onClick={()=>setOpen(!open)}>▾</button>
              <button className={`btn-ghost ${showChart?"btn-ghost-on":""}`} style={{padding:"4px 7px",fontSize:11}} onClick={()=>setShowChart(!showChart)}>📊</button>
              {/* delete exercise — trash icon */}
              <button onClick={onDelete}
                style={{background:"transparent",border:"none",color:"rgba(255,80,80,.45)",cursor:"pointer",fontSize:14,padding:"4px 5px",transition:"color .15s",lineHeight:1}}
                title="Delete exercise"
                onMouseEnter={e=>e.target.style.color="rgba(255,80,80,.9)"}
                onMouseLeave={e=>e.target.style.color="rgba(255,80,80,.45)"}>🗑</button>
            </div>
          </div>
          <div className="pbar-track" style={{height:3}}>
            <div className="pbar-fill" style={{width:`${pct}%`,background:done?color:`${color}88`}}/>
          </div>
        </div>
      </div>

      {/* SETS EXPANDED */}
      {open&&(
        <div style={{padding:"10px 12px 12px",display:"flex",flexDirection:"column",gap:7}} className="slide">
          <div className="lbl" style={{marginBottom:4,color:"rgba(255,255,255,.5)"}}>SETS</div>
          {sets.map((s,i)=>(
            <div key={i} style={{display:"grid",gridTemplateColumns:"26px 1fr 1fr 28px",gap:6,alignItems:"center",background:"rgba(0,0,0,.55)",border:"1px solid rgba(255,255,255,.06)",borderRadius:10,padding:"8px 10px",boxShadow:"0 2px 8px rgba(0,0,0,.4)"}}>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:11,fontWeight:500,color,textAlign:"center"}}>{String(i+1).padStart(2,"0")}</span>
              {[["WT",ex.unit,s.weight,"weight"],["REPS","×",s.reps,"reps"]].map(([lbl,ph,val,field])=>(
                <div key={field}>
                  <div style={{fontSize:8,color:"rgba(255,255,255,.34)",letterSpacing:1,fontFamily:"'DM Mono',monospace",marginBottom:3,textAlign:"center"}}>{lbl} ({ph})</div>
                  <input type="number" value={val} placeholder="—" className="num-in" style={{fontSize:18,fontWeight:700,padding:"5px 4px"}} onChange={e=>upd(i,field,e.target.value)}/>
                </div>
              ))}
              {/* delete individual set — disabled when only one remains */}
              <button onClick={()=>sets.length>1&&onSets(sets.filter((_,j)=>j!==i))}
                style={{background:"transparent",border:"none",color:sets.length>1?"rgba(255,80,80,.55)":"rgba(255,255,255,.1)",cursor:sets.length>1?"pointer":"not-allowed",fontSize:16,paddingTop:12,transition:"color .15s"}}
                title="Delete set"
                onMouseEnter={e=>{if(sets.length>1)e.target.style.color="rgba(255,80,80,.9)"}}
                onMouseLeave={e=>{if(sets.length>1)e.target.style.color="rgba(255,80,80,.55)"}}>×</button>
            </div>
          ))}
          <div style={{display:"flex",gap:6,marginTop:4}}>
            <button className="btn-ghost" style={{flex:1,padding:"8px",fontSize:11,letterSpacing:1}} onClick={()=>onSets([...sets,{weight:"",reps:""}])}>+ SET</button>
            {prev&&<button className="btn-ghost" style={{flex:1,padding:"8px",fontSize:11,letterSpacing:1,color:"rgba(200,255,0,.75)",borderColor:"rgba(200,255,0,.22)"}} onClick={()=>onSets(sets.map(()=>({weight:prev.weight,reps:prev.reps})))}>↩ FILL LAST</button>}
          </div>
          {/* "Default Sets" / "Default Reps" inputs removed per spec — notes field kept */}
          <textarea placeholder="Notes…" value={ex.notes||""} onChange={e=>onEx({...ex,notes:e.target.value})} rows={2}
            style={{background:"rgba(0,0,0,.5)",border:"1px solid rgba(255,255,255,.06)",borderRadius:8,color:"rgba(255,255,255,.72)",fontSize:11,padding:"8px 10px",resize:"none",outline:"none",fontFamily:"'DM Mono',monospace",marginTop:4,transition:"border-color .2s"}}
            onFocus={e=>{e.target.style.borderColor=`${color}30`}} onBlur={e=>{e.target.style.borderColor="rgba(255,255,255,.06)"}}/>
        </div>
      )}

      {/* CHART */}
      {showChart&&(
        <div style={{padding:"0 12px 12px",borderTop:"1px solid rgba(255,255,255,.05)"}} className="slide">
          <Chart exName={ex.name} color={color}/>
        </div>
      )}
    </div>
  );
}

/* ─── ANALYTICS DASHBOARD ────────────────────────────────── */
function Analytics({logs,exercises}){
  const [catF,setCatF]=useState("ALL");
  const [range,setRange]=useState("ALL");
  const [sort,setSort]=useState("NEWEST");
  const [search,setSearch]=useState("");
  const [exp,setExp]=useState(null);
  const today=todayISO();

  const filtered=useMemo(()=>{
    const days=range==="7D"?7:range==="30D"?30:99999;
    const cut=Date.now()-days*86400000;
    return Object.keys(logs).filter(d=>{
      if(d.startsWith("_"))return false;
      const dw=Object.keys(logs[d]||{}).filter(k=>!k.startsWith("_"));
      return new Date(d).getTime()>=cut&&(catF==="ALL"||dw.includes(catF))&&(!search||(d.includes(search)||dw.some(c=>c.toLowerCase().includes(search.toLowerCase()))));
    }).sort((a,b)=>sort==="NEWEST"?b.localeCompare(a):sort==="OLDEST"?a.localeCompare(b):Object.keys(logs[b]||{}).length-Object.keys(logs[a]||{}).length);
  },[logs,catF,range,sort,search]);

  let totSets=0,totMins=0,totCals=0,totKm=0;const catCnt={};
  filtered.forEach(d=>{
    Object.entries(logs[d]||{}).filter(([k])=>!k.startsWith("_")).forEach(([cat,data])=>{
      catCnt[cat]=(catCnt[cat]||0)+1;
      if(cat==="CARDIO"&&data.cardio){totMins+=+data.cardio.duration||0;totCals+=+data.cardio.calories||0;totKm+=+data.cardio.distance||0}
      else Object.values(data).forEach(v=>{if(Array.isArray(v))totSets+=v.filter(s=>s.weight||s.reps).length});
    });
  });
  const favCat=Object.entries(catCnt).sort((a,b)=>b[1]-a[1])[0];

  const last7=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=d.toISOString().split("T")[0];return{k,dow:d.toLocaleDateString("en-US",{weekday:"short"}).slice(0,2).toUpperCase(),n:Object.keys(logs[k]||{}).filter(x=>!x.startsWith("_")).length}});

  const stats=[
    {l:"SESSIONS",v:filtered.length,       u:"total",  ico:"📅",c:C.lime},
    {l:"SETS",    v:totSets,                u:"logged", ico:"💪",c:C.cyan},
    {l:"CARDIO",  v:Math.round(totMins),    u:"min",    ico:"🏃",c:C.pink},
    {l:"CALORIES",v:Math.round(totCals),    u:"kcal",   ico:"🔥",c:C.orange},
    {l:"KM",      v:totKm.toFixed(1),       u:"run",    ico:"📏",c:C.violet},
    {l:"TOP SPLIT",v:favCat?favCat[0].split(" ")[0]:"—",u:favCat?`${favCat[1]}×`:"",ico:"⭐",c:"#FFD700"},
  ];

  return(
    <div style={{padding:"14px 14px 0"}}>
      <div className="glass" style={{padding:"10px 14px",marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:14,color:"rgba(255,255,255,.4)"}}>⌕</span>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search date or category…"
          style={{flex:1,background:"transparent",border:"none",color:"#fff",fontSize:13,outline:"none",fontFamily:"'DM Mono',monospace"}}/>
      </div>
      <div style={{display:"flex",gap:5,marginBottom:8,overflowX:"auto",paddingBottom:2}}>
        {[{l:"ALL",v:"ALL"},{l:"7D",v:"7D"},{l:"30D",v:"30D"}].map(r=><button key={r.v} className={`chip ${range===r.v?"chip-on":""}`} onClick={()=>setRange(r.v)}>{r.l}</button>)}
        <div style={{width:1,background:"rgba(255,255,255,.08)",flexShrink:0,margin:"0 4px"}}/>
        {["NEWEST","OLDEST","MOST VOL"].map(s=><button key={s} className={`chip ${sort===s?"chip-on":""}`} onClick={()=>setSort(s)}>{s}</button>)}
      </div>
      <div style={{display:"flex",gap:5,marginBottom:14,overflowX:"auto",paddingBottom:2}}>
        {["ALL",...Object.keys(SPLITS)].map(c=>{const col=SPLITS[c]?.color||C.lime;const active=catF===c;return<button key={c} className={`chip ${active?"chip-on":""}`} style={active?{background:`${col}18`,borderColor:col,color:col}:{}} onClick={()=>setCatF(c)}>{c==="ALL"?"⚡ ALL":`${SPLITS[c].emoji} ${c}`}</button>})}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
        {stats.map(s=>(
          <div key={s.l} className="glass" style={{padding:"12px 8px",textAlign:"center"}}>
            <div style={{fontSize:18,marginBottom:3}}>{s.ico}</div>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:22,color:s.c,lineHeight:1,textShadow:`0 0 16px ${s.c}44`}}>{s.v}</div>
            <div style={{fontSize:8,color:"rgba(255,255,255,.35)",fontFamily:"'DM Mono',monospace",letterSpacing:.8,marginTop:2}}>{s.u}</div>
            <div style={{fontSize:7,color:"rgba(255,255,255,.2)",fontFamily:"'DM Mono',monospace",letterSpacing:.8,marginTop:1}}>{s.l}</div>
          </div>
        ))}
      </div>

      <div className="glass" style={{padding:"14px 16px",marginBottom:14}}>
        <div className="lbl" style={{marginBottom:12,color:"rgba(255,255,255,.55)"}}>WEEKLY FREQUENCY</div>
        <div style={{display:"flex",gap:6,alignItems:"flex-end",height:52}}>
          {last7.map(({k,dow,n})=>(
            <div key={k} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
              <div style={{width:"100%",borderRadius:"4px 4px 2px 2px",height:n>0?Math.max(8,n*16):4,background:n>0?"linear-gradient(180deg,#C8FF00,#8ab000)":"rgba(255,255,255,.05)",boxShadow:n>0?"0 0 10px rgba(200,255,0,.45)":"none",transition:"height .4s"}}/>
              <div style={{fontSize:8,color:k===today?"#fff":"rgba(255,255,255,.32)",fontFamily:"'DM Mono',monospace",fontWeight:k===today?700:400}}>{dow}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="lbl" style={{marginBottom:10,color:"rgba(255,255,255,.42)"}}>{filtered.length} SESSION{filtered.length!==1?"S":""}</div>
      {filtered.length===0
        ?<div className="glass" style={{padding:"40px 20px",textAlign:"center"}}><div style={{fontSize:40,marginBottom:10}}>📋</div><div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:16,letterSpacing:2,color:"rgba(255,255,255,.28)"}}>NO SESSIONS FOUND</div></div>
        :filtered.map(date=>{
          const dl=logs[date]||{};const dw=Object.keys(dl).filter(k=>!k.startsWith("_"));const isToday=date===today;const isOpen=exp===date;
          const dur=dl._meta?.duration;
          return(
            <div key={date} className="glass" style={{marginBottom:10,overflow:"hidden",borderLeft:`2px solid ${isToday?C.lime:"rgba(255,255,255,.06)"}`}}>
              <div onClick={()=>setExp(isOpen?null:date)} style={{display:"flex",alignItems:"center",padding:"13px 14px",cursor:"pointer",gap:10}}>
                <div style={{flex:1}}>
                  <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:14,letterSpacing:1.5,color:"#fff",display:"flex",alignItems:"center",gap:8}}>
                    {new Date(date+"T00:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}).toUpperCase()}
                    {isToday&&<span style={{background:"rgba(200,255,0,.12)",border:"1px solid rgba(200,255,0,.35)",borderRadius:100,padding:"2px 8px",fontSize:8,color:C.lime,fontFamily:"'DM Mono',monospace",letterSpacing:1}}>TODAY</span>}
                  </div>
                  <div className="lbl" style={{marginTop:3,color:"rgba(255,255,255,.4)"}}>{dw.length} SPLIT{dw.length!==1?"S":""}  {dur?`· ${dur}min`:""}</div>
                </div>
                <div style={{display:"flex",gap:4}}>{dw.map(d=><span key={d} style={{fontSize:18,filter:`drop-shadow(0 0 6px ${SPLITS[d]?.color||"#fff"}aa)`}}>{SPLITS[d]?.emoji||"🏋️"}</span>)}</div>
                <span style={{color:"rgba(255,255,255,.3)",fontSize:14,transform:isOpen?"rotate(180deg)":"none",transition:"transform .2s"}}>▾</span>
              </div>
              {isOpen&&(
                <div style={{padding:"0 14px 14px",borderTop:"1px solid rgba(255,255,255,.05)"}}>
                  {dw.map(cat=>{
                    const col=SPLITS[cat]?.color||C.lime;const ed=dl[cat]||{};
                    return(
                      <div key={cat} style={{marginTop:14}}>
                        <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:12,letterSpacing:2,color:col,marginBottom:8}}>{SPLITS[cat]?.emoji} {cat}</div>
                        {cat==="CARDIO"&&ed.cardio
                          ?<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                              {[["⏱",ed.cardio.duration,"min"],["📏",ed.cardio.distance,"km"],["🔥",ed.cardio.calories,"kcal"],["💨",ed.cardio.speed,"km/h"]].map(([ic,v,u])=>v?<div key={u} className="glass" style={{padding:"7px 12px",textAlign:"center",minWidth:58}}><div style={{fontSize:13}}>{ic}</div><div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18,color:col}}>{v}</div><div style={{fontSize:8,color:"rgba(255,255,255,.4)"}}>{u}</div></div>:null)}
                            </div>
                          :<div style={{display:"flex",flexDirection:"column",gap:4}}>
                              {Object.entries(ed).filter(([k])=>!isNaN(k)).map(([i,sets])=>{
                                if(!Array.isArray(sets)||!sets.some(s=>s.weight||s.reps))return null;
                                const exList=exercises[cat]||DEF[cat]||[];
                                const nm=exList[+i]?.name||`Exercise ${+i+1}`;
                                const valid=sets.filter(s=>s.weight||s.reps);
                                return<div key={i} style={{background:"rgba(0,0,0,.45)",borderRadius:8,padding:"7px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",border:"1px solid rgba(255,255,255,.04)"}}>
                                  <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:"rgba(255,255,255,.45)",letterSpacing:.8}}>{nm}</span>
                                  <span style={{fontFamily:"'DM Mono',monospace",fontSize:12,color:col,fontWeight:500}}>{valid.map(s=>`${s.weight||0}lb×${s.reps||0}`).join("  ")}</span>
                                </div>;
                              })}
                            </div>
                        }
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })
      }
    </div>
  );
}

/* ─── ROOT APP ───────────────────────────────────────────── */
function App(){
  const [view,setView]=useState("log");
  const [activeSplit,setActiveSplit]=useState(null);
  const [userName,setUserName]=useState(()=>LS.str("il_name","ATHLETE"));
  const [editName,setEditName]=useState(false);
  const [exercises,setExercises]=useState(()=>LS.get("il_ex_v6",DEF));
  const [logs,setLogs]=useState(()=>LS.get("il_logs_v6",{}));
  const [savedMsg,setSavedMsg]=useState(false);
  const [workoutOn,setWorkoutOn]=useState(false);
  const [startTime,setStartTime]=useState(null);
  const [elapsed,setElapsed]=useState(0);
  const [endTime,setEndTime]=useState(null);
  const timerRef=useRef(null);
  const today=todayISO();
  // ── Update 2: workout name persisted in LS ──
  const [workoutName,setWorkoutName]=useState(()=>LS.str("il_wname","MY WORKOUT"));

  useEffect(()=>{ LS.set("il_ex_v6",exercises) },[exercises]);

  // ── Update 8: timer ticks every second from wall-clock diff — never drifts ──
  useEffect(()=>{
    clearInterval(timerRef.current);
    if(workoutOn&&startTime&&!endTime){
      timerRef.current=setInterval(()=>{
        setElapsed(Math.floor((Date.now()-new Date(startTime).getTime())/1000));
      },1000);
    }
    return()=>clearInterval(timerRef.current);
  },[workoutOn,startTime,endTime]);

  const splitColor=activeSplit?SPLITS[activeSplit].color:C.lime;

  // ── Update 8: instant start — setInterval fires in the same tick ──
  const handleStart=()=>{
    const now=new Date().toISOString();
    setStartTime(now);setWorkoutOn(true);setEndTime(null);setElapsed(0);
    setLogs(prev=>{const u={...prev,[today]:{...(prev[today]||{}),_meta:{...(prev[today]?._meta||{}),startTime:now,endTime:null,duration:null}}};LS.set("il_logs_v6",u);return u});
  };

  // ── Update 8: instant stop — clearInterval before any state update ──
  const handleEnd=()=>{
    clearInterval(timerRef.current);   // freeze immediately
    const now=new Date().toISOString();
    const durMins=Math.round(elapsed/60);
    setEndTime(now);setWorkoutOn(false);
    setLogs(prev=>{const u={...prev,[today]:{...(prev[today]||{}),_meta:{...(prev[today]?._meta||{}),endTime:now,duration:durMins}}};LS.set("il_logs_v6",u);return u});
  };

  const handleSplit=split=>{
    setActiveSplit(split);
    if(!workoutOn&&!startTime)handleStart();
    setLogs(prev=>{const u={...prev,[today]:{...(prev[today]||{}),[split]:{...(prev[today]?.[split]||{}),_start:new Date().toISOString()}}};LS.set("il_logs_v6",u);return u});
  };

  const getPrev=useCallback((split,idx)=>{
    const nm=exercises[split]?.[idx]?.name;if(!nm)return null;
    const past=Object.keys(logs).filter(d=>d!==today&&!d.startsWith("_")).sort().reverse();
    for(const d of past){
      const sets=logs[d]?.[split]?.[idx];
      if(Array.isArray(sets)&&sets.some(s=>s.weight||s.reps)){
        const v=sets.filter(s=>s.weight||s.reps);
        return{weight:(v.reduce((a,s)=>a+(+s.weight||0),0)/v.length).toFixed(1),reps:Math.round(v.reduce((a,s)=>a+(+s.reps||0),0)/v.length),sets:v.length,date:d.slice(5)};
      }
    }
    return null;
  },[logs,exercises,today]);

  // ── Update 6: live sets written to logs only — NOT to chart history ──
  const updateSets=(split,idx,sets)=>{
    setLogs(prev=>{
      const td={...(prev[today]||{})};
      td[split]={...(td[split]||{}),[idx]:sets};
      const u={...prev,[today]:td};LS.set("il_logs_v6",u);
      return u;  // no chart write here — chart only updates on Save
    });
  };

  const updateCardio=(key,val)=>{
    setLogs(prev=>{
      const u={...prev,[today]:{...(prev[today]||{}),CARDIO:{...(prev[today]?.CARDIO||{}),cardio:{...(prev[today]?.CARDIO?.cardio||{}),[key]:val}}}};
      LS.set("il_logs_v6",u);return u;
    });
  };

  // ── Update 6: chart history committed only on explicit Save ──
  const handleSave=()=>{
    LS.set("il_logs_v6",logs);
    // write to save-gated store now
    const hist=LS.get("il_slog_saved",[])||[];
    const td=logs[today]||{};
    Object.entries(td).filter(([k])=>!k.startsWith("_")).forEach(([split,data])=>{
      if(split==="CARDIO"){
        if(data.cardio?.distance){
          const ei=hist.findIndex(h=>h.date===today&&h.exName==="__CARDIO_KM__");
          const entry={date:today,exName:"__CARDIO_KM__",maxW:+data.cardio.distance,vol:+data.cardio.distance};
          if(ei>=0)hist[ei]=entry;else hist.push(entry);
        }
      } else {
        (exercises[split]||[]).forEach((ex,i)=>{
          const sets=data[i];
          if(Array.isArray(sets)&&sets.some(s=>s.weight||s.reps)){
            const v=sets.filter(s=>s.weight||s.reps);
            const maxW=Math.max(...v.map(s=>+s.weight||0));
            const vol=v.reduce((a,s)=>a+(+s.weight||0)*(+s.reps||0),0);
            const ei=hist.findIndex(h=>h.date===today&&h.exName===ex.name);
            const entry={date:today,exName:ex.name,maxW,vol};
            if(ei>=0)hist[ei]=entry;else hist.push(entry);
          }
        });
      }
    });
    LS.set("il_slog_saved",hist.slice(-2000));
    setSavedMsg(true);setTimeout(()=>setSavedMsg(false),2400);
  };

  const updateExMeta=(split,idx,ex)=>{
    setExercises(prev=>{const u={...prev,[split]:[...prev[split]]};u[split][idx]=ex;return u});
  };

  // ── Update 2: delete exercise by index ──
  const deleteExercise=(split,idx)=>{
    setExercises(prev=>({...prev,[split]:prev[split].filter((_,i)=>i!==idx)}));
  };

  const getProgress=split=>{
    const exList=exercises[split]||[];if(!exList.length)return 0;
    const total=exList.reduce((a)=>a+3,0);
    const done=exList.reduce((acc,ex,i)=>{const s=logs[today]?.[split]?.[i];return acc+(Array.isArray(s)?s.filter(x=>x.weight||x.reps).length:0)},0);
    return total>0?Math.round(done/total*100):0;
  };

  const meta=logs[today]?._meta||{};
  const timerRunning=workoutOn&&!endTime;

  return(
    <div style={{minHeight:"100vh",background:"transparent",color:"#fff",maxWidth:480,margin:"0 auto",paddingBottom:100,fontFamily:"'Syne',sans-serif",position:"relative"}}>
      <style>{CSS}</style>
      <AnimBG col={splitColor}/>

      {/* ══ HEADER ══ */}
      <div style={{position:"sticky",top:0,zIndex:300,background:"rgba(5,2,15,.8)",backdropFilter:"blur(32px)",borderBottom:"1px solid rgba(255,255,255,.07)",padding:"12px 14px 10px"}}>
        {/* Row 1: logo + name + nav */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:40,height:40,borderRadius:12,flexShrink:0,background:`linear-gradient(135deg,${splitColor},${splitColor}66)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,boxShadow:`0 0 20px ${splitColor}55`,transition:"all 1.2s"}}>⚡</div>
            <div>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:8,letterSpacing:4,color:"rgba(255,255,255,.35)"}}>IRON LOG</div>
              {editName
                ?<input value={userName} onChange={e=>setUserName(e.target.value.toUpperCase())} onBlur={()=>{setEditName(false);LS.sset("il_name",userName)}} onKeyDown={e=>e.key==="Enter"&&setEditName(false)} autoFocus maxLength={14} style={{background:"transparent",border:"none",borderBottom:`1.5px solid ${splitColor}`,color:"#fff",fontSize:17,fontFamily:"'Syne',sans-serif",fontWeight:800,letterSpacing:2,outline:"none",width:150}}/>
                :<div onClick={()=>setEditName(true)} style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:17,letterSpacing:2,cursor:"pointer",display:"flex",alignItems:"center",gap:5,background:`linear-gradient(90deg,#fff 35%,${splitColor})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
                  {userName}<span style={{fontSize:11,WebkitTextFillColor:splitColor,opacity:.5}}>✎</span>
                </div>
              }
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            {timerRunning&&<div style={{background:"rgba(200,255,0,.08)",border:"1px solid rgba(200,255,0,.2)",borderRadius:8,padding:"4px 9px",fontFamily:"'DM Mono',monospace",fontSize:13,fontWeight:500,color:C.lime,letterSpacing:2}} className="blink">{fmtSecs(elapsed)}</div>}
            {endTime&&!timerRunning&&<div style={{background:"rgba(255,60,172,.08)",border:"1px solid rgba(255,60,172,.2)",borderRadius:8,padding:"4px 9px",fontFamily:"'DM Mono',monospace",fontSize:11,color:C.pink,letterSpacing:1}}>{meta.duration||Math.round(elapsed/60)}m</div>}
            {["LOG","ANALYTICS"].map(v=><button key={v} className={view===v.toLowerCase()?"btn-lime":"btn-ghost"} style={{padding:"7px 11px",fontSize:10,letterSpacing:1}} onClick={()=>setView(v.toLowerCase())}>{v}</button>)}
          </div>
        </div>

        {/* Row 2: Start / End buttons */}
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <button className="btn-start" style={{flex:1,padding:"10px",fontSize:12,letterSpacing:2}} disabled={workoutOn} onClick={handleStart}>▶ START WORKOUT</button>
          <button className="btn-end"   style={{flex:1,padding:"10px",fontSize:12,letterSpacing:2}} disabled={!workoutOn} onClick={handleEnd}>■ END WORKOUT</button>
        </div>

        {/* Row 3: time display */}
        {(startTime||endTime)&&(
          <div style={{display:"flex",gap:12,padding:"7px 11px",background:"rgba(0,0,0,.42)",borderRadius:9,border:"1px solid rgba(255,255,255,.06)"}}>
            {startTime&&<div><div style={{fontSize:8,color:"rgba(255,255,255,.35)",fontFamily:"'DM Mono',monospace",letterSpacing:1}}>STARTED</div><div style={{fontSize:11,color:"#fff",fontFamily:"'DM Mono',monospace",fontWeight:500}}>{fmtDT(startTime)}</div></div>}
            {endTime&&<div><div style={{fontSize:8,color:"rgba(255,255,255,.35)",fontFamily:"'DM Mono',monospace",letterSpacing:1}}>ENDED</div><div style={{fontSize:11,color:C.pink,fontFamily:"'DM Mono',monospace",fontWeight:500}}>{fmtDT(endTime)}</div></div>}
            {endTime&&startTime&&<div style={{marginLeft:"auto"}}><div style={{fontSize:8,color:"rgba(255,255,255,.35)",fontFamily:"'DM Mono',monospace",letterSpacing:1}}>DURATION</div><div style={{fontSize:11,color:C.lime,fontFamily:"'DM Mono',monospace",fontWeight:700}}>{meta.duration||Math.round(elapsed/60)} MIN</div></div>}
          </div>
        )}
      </div>

      {/* ══ LOG VIEW ══ */}
      {view==="log"&&(
        <div style={{padding:"14px 14px 0",position:"relative",zIndex:10}} className="fadeup">
          {!activeSplit?(
            <div>
              <div style={{marginBottom:18}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:28,letterSpacing:2,lineHeight:1,color:"#fff"}}>
                  SELECT <span style={{color:C.lime,textShadow:`0 0 24px ${C.lime}77`}}>SPLIT</span>
                </div>
                <div style={{marginTop:7}}>
                  <div className="lglass" style={{fontSize:11,color:"#fff",fontFamily:"'DM Mono',monospace",letterSpacing:2}}>
                    📅 {new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}).toUpperCase()}
                  </div>
                </div>
              </div>
              {Object.entries(SPLITS).map(([key,split],i)=>{
                const pct=getProgress(key);const doneToday=!!(logs[today]?.[key]);
                return(
                  <button key={key} className="glass" onClick={()=>handleSplit(key)}
                    style={{width:"100%",marginBottom:10,padding:"16px 18px",cursor:"pointer",display:"flex",alignItems:"center",gap:14,textAlign:"left",border:`1px solid ${doneToday?split.color+"44":"rgba(255,255,255,.08)"}`,animation:`fadeUp .3s ease ${i*.06}s both`}}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor=`${split.color}55`;e.currentTarget.style.transform="translateY(-2px)"}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor=doneToday?`${split.color}44`:"rgba(255,255,255,.08)";e.currentTarget.style.transform="translateY(-2px)"}}>
                    <div style={{width:54,height:54,borderRadius:16,flexShrink:0,background:`${split.color}18`,border:`1.5px solid ${split.color}33`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,boxShadow:`0 0 16px ${split.color}22`}}>{split.emoji}</div>
                    <div style={{flex:1}}>
                      <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:17,letterSpacing:2,color:doneToday?split.color:"#fff"}}>{split.label}</div>
                      <div style={{fontSize:11,color:"rgba(255,255,255,.6)",fontFamily:"'DM Mono',monospace",letterSpacing:1,marginTop:2}}>{split.sub}</div>
                      {pct>0&&<div style={{marginTop:8}}><div className="pbar-track" style={{height:3}}><div className="pbar-fill" style={{width:`${pct}%`,background:split.color}}/></div><div style={{fontSize:9,color:split.color,marginTop:3,fontFamily:"'DM Mono',monospace"}}>{pct}% LOGGED TODAY</div></div>}
                    </div>
                    <div style={{width:30,height:30,borderRadius:9,background:`${split.color}18`,border:`1px solid ${split.color}33`,display:"flex",alignItems:"center",justifyContent:"center",color:split.color,fontSize:16,fontWeight:700}}>›</div>
                  </button>
                );
              })}
            </div>
          ):(
            <div>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
                <button className="btn-ghost" style={{padding:"8px 12px",fontSize:11,letterSpacing:1}} onClick={()=>setActiveSplit(null)}>‹ BACK</button>
                <div style={{flex:1}}>
                  <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,letterSpacing:3,background:`linear-gradient(90deg,#fff 30%,${splitColor})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{SPLITS[activeSplit].emoji} {SPLITS[activeSplit].label}</div>
                  <div style={{marginTop:4}}>
                    <div className="lglass" style={{fontSize:9,color:"rgba(255,255,255,.8)",fontFamily:"'DM Mono',monospace",letterSpacing:1}}>
                      {SPLITS[activeSplit].sub}{logs[today]?.[activeSplit]?._start?` · STARTED ${new Date(logs[today][activeSplit]._start).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"})}`:""}
                    </div>
                  </div>
                </div>
                {activeSplit!=="CARDIO"&&(
                  <div style={{textAlign:"center"}}>
                    <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:26,color:splitColor,lineHeight:1,textShadow:`0 0 20px ${splitColor}66`}}>{getProgress(activeSplit)}%</div>
                    <div className="pbar-track" style={{width:44,marginTop:4,height:4}}><div className="pbar-fill" style={{width:`${getProgress(activeSplit)}%`,background:splitColor}}/></div>
                  </div>
                )}
              </div>

              {activeSplit==="CARDIO"
                ?<CardioPanel data={logs[today]?.CARDIO?.cardio||{}} onChange={updateCardio} color={splitColor}/>
                :(
                  <div>
                    {/* editable workout name */}
                    <input value={workoutName} onChange={e=>{setWorkoutName(e.target.value.toUpperCase());LS.sset("il_wname",e.target.value.toUpperCase())}}
                      style={{background:"transparent",border:"none",borderBottom:`1px solid ${splitColor}33`,color:"#fff",fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:14,letterSpacing:2,outline:"none",width:"100%",paddingBottom:5,marginBottom:14,transition:"border-color .2s"}}
                      onFocus={e=>e.target.style.borderBottomColor=splitColor}
                      onBlur={e=>e.target.style.borderBottomColor=`${splitColor}33`}
                      placeholder="NAME OF THE WORKOUT"/>
                    {(exercises[activeSplit]||DEF[activeSplit]||[]).map((ex,i)=>(
                      <ExCard key={ex.id||i} ex={ex} idx={i} color={splitColor}
                        savedSets={logs[today]?.[activeSplit]?.[i]||null}
                        onSets={sets=>updateSets(activeSplit,i,sets)}
                        onEx={nex=>updateExMeta(activeSplit,i,nex)}
                        onDelete={()=>deleteExercise(activeSplit,i)}
                        prev={getPrev(activeSplit,i)}/>
                    ))}
                  </div>
                )
              }

              {activeSplit!=="CARDIO"&&(
                <button className="btn-ghost" style={{width:"100%",padding:"11px",fontSize:11,letterSpacing:2,marginBottom:10}}
                  onClick={()=>{const n={id:`${activeSplit}_${Date.now()}`,name:"NEW EXERCISE",sets:3,reps:10,unit:"lb"};setExercises(prev=>({...prev,[activeSplit]:[...(prev[activeSplit]||[]),n]}))}}>
                  + ADD EXERCISE
                </button>
              )}

              <button className="btn-lime" onClick={handleSave}
                style={{width:"100%",padding:"16px",fontSize:16,letterSpacing:3,background:savedMsg?"linear-gradient(135deg,#00C853,#00E676)":undefined,boxShadow:savedMsg?"0 4px 24px rgba(0,200,83,.45)":undefined,transition:"all .3s"}}>
                {savedMsg?"✓ SESSION SAVED — NUMBERS STAY VISIBLE":"SAVE SESSION"}
              </button>
              <div style={{marginTop:7,textAlign:"center",fontFamily:"'DM Mono',monospace",fontSize:9,color:"rgba(255,255,255,.28)",letterSpacing:1}}>RE-SAVE ANYTIME TO UPDATE TODAY'S ENTRY</div>
            </div>
          )}
        </div>
      )}

      {/* ══ ANALYTICS VIEW ══ */}
      {view==="analytics"&&(
        <div style={{position:"relative",zIndex:10}} className="fadeup">
          <Analytics logs={logs} exercises={exercises}/>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
